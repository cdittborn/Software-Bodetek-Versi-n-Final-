name: Respaldo archivos R2

on:
  schedule:
    # Mismo truco UTC → 04:00 Chile. El job exige domingo en America/Santiago.
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-archivos
  cancel-in-progress: false

jobs:
  sync:
    name: Copia incremental al bucket de respaldos
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 120
    env:
      TZ: America/Santiago
    steps:
      - name: ¿Domingo 04:00 Chile?
        run: |
          set -euo pipefail
          HORA="$(date +%H)"
          DOW="$(date +%u)" # 7 = domingo
          echo "Hora Chile: $(date '+%F %H:%M %Z') weekday=$DOW"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            if [[ "$HORA" != "04" || "$DOW" != "7" ]]; then
              echo "Skip: no es domingo 04:00 Chile."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        id: hora

      - uses: actions/checkout@v4
        if: steps.hora.outputs.skip != 'true'

      - name: Sync incremental (sin borrar en destino)
        if: steps.hora.outputs.skip != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          chmod +x scripts/respaldo-archivos.sh
          ./scripts/respaldo-archivos.sh
