name: Respaldo archivos R2

on:
  schedule:
    # Mismo cron que la base. Si el marcador de la semana (domingo, fecha Chile)
    # ya existe, el script no vuelve a copiar. Un atraso de GitHub no se salta la semana.
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-archivos
  cancel-in-progress: false

jobs:
  sync:
    name: Copia incremental al bucket de respaldos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v5

      - name: Sync incremental (sin borrar en destino)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x scripts/respaldo-archivos.sh
          ./scripts/respaldo-archivos.sh
