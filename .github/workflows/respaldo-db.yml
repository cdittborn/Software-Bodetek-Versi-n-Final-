name: Respaldo base de datos

on:
  schedule:
    # 06:00 y 07:00 UTC. GitHub suele atrasarlos; no exigimos las 04:00 Chile.
    # Si db/AAAA-MM-DD.sql.gz (fecha Chile) ya existe, el script no vuelve a subir.
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-db
  cancel-in-progress: false

jobs:
  dump:
    name: Dump public+auth → R2 privado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Santiago
    steps:
      - uses: actions/checkout@v5

      - name: Instalar AWS CLI
        run: aws --version

      - name: Dump, verificar y subir
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MIN_DUMP_BYTES: "10000"
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          chmod +x scripts/respaldo-pg-url.sh scripts/respaldo-db.sh
          ./scripts/respaldo-db.sh
